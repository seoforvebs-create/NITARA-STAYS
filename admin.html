
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Nitara Stays</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --ivory:#F5F0E8;--black:#1A1A1A;--gold:#C8A96E;
      --taupe:#8A7B6A;--stone:#D8CBB8;--forest:#5C6B5F;
      --success:#2d7a4f;--error:#c0392b;--pending:#b7860b;
    }
    body{font-family:'Lato',sans-serif;background:#f0ece4;color:var(--black);min-height:100vh;}

    /* ── Auth Overlay ── */
    #auth-overlay{
      position:fixed;inset:0;background:var(--black);
      display:flex;align-items:center;justify-content:center;z-index:1000;
    }
    .auth-box{
      background:white;padding:56px 48px;width:100%;max-width:420px;
      border-radius:4px;text-align:center;
    }
    .auth-logo{font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:4px;color:var(--black);margin-bottom:4px;}
    .auth-logo span{color:var(--gold);}
    .auth-sub{font-size:11px;letter-spacing:3px;color:var(--taupe);text-transform:uppercase;margin-bottom:36px;}
    .auth-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--taupe);display:block;text-align:left;margin-bottom:8px;}
    .auth-input{
      width:100%;padding:14px 16px;border:1px solid var(--stone);background:var(--ivory);
      font-family:'Lato',sans-serif;font-size:14px;border-radius:2px;outline:none;
      transition:border-color .2s;
    }
    .auth-input:focus{border-color:var(--gold);}
    .auth-btn{
      width:100%;margin-top:20px;padding:15px;background:var(--black);color:var(--gold);
      border:none;font-family:'Lato',sans-serif;font-size:12px;letter-spacing:3px;
      text-transform:uppercase;cursor:pointer;border-radius:2px;transition:background .2s;
    }
    .auth-btn:hover{background:#333;}
    #auth-error{color:var(--error);font-size:13px;margin-top:12px;min-height:20px;}

    /* ── Dashboard ── */
    #dashboard{display:none;}
    .admin-nav{
      background:var(--black);padding:0 32px;display:flex;
      align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;
    }
    .admin-nav-logo{font-family:'Cormorant Garamond',serif;font-size:18px;letter-spacing:3px;color:white;}
    .admin-nav-logo span{color:var(--gold);}
    .admin-nav-right{display:flex;align-items:center;gap:20px;}
    #current-date{font-size:12px;color:#888;letter-spacing:1px;}
    .logout-btn{
      background:transparent;border:1px solid #444;color:#aaa;
      padding:8px 16px;font-size:11px;letter-spacing:2px;text-transform:uppercase;
      cursor:pointer;border-radius:2px;transition:all .2s;font-family:'Lato',sans-serif;
    }
    .logout-btn:hover{border-color:var(--gold);color:var(--gold);}

    .admin-body{max-width:1400px;margin:0 auto;padding:32px 24px;}

    /* ── Stats Cards ── */
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:36px;}
    .stat-card{
      background:white;padding:28px 24px;border-radius:4px;
      border-bottom:3px solid transparent;transition:border-color .2s;
    }
    .stat-card:hover{border-bottom-color:var(--gold);}
    .stat-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--taupe);margin-bottom:12px;}
    .stat-value{font-family:'Cormorant Garamond',serif;font-size:36px;color:var(--black);font-weight:600;}
    .stat-icon{font-size:20px;margin-bottom:8px;}

    /* ── Tabs ── */
    .tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:2px solid var(--stone);}
    .tab-btn{
      padding:12px 28px;font-size:11px;letter-spacing:2px;text-transform:uppercase;
      background:transparent;border:none;cursor:pointer;color:var(--taupe);
      font-family:'Lato',sans-serif;border-bottom:2px solid transparent;margin-bottom:-2px;
      transition:all .2s;
    }
    .tab-btn.active,.tab-btn:hover{color:var(--black);border-bottom-color:var(--gold);}
    .tab-panel{display:none;}
    .tab-panel.active{display:block;}

    /* ── Filters ── */
    .filters-bar{
      background:white;padding:20px 24px;border-radius:4px;
      display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:20px;
    }
    .filter-group{display:flex;flex-direction:column;gap:6px;flex:1;min-width:140px;}
    .filter-group label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--taupe);}
    .filter-group input,.filter-group select{
      padding:9px 12px;border:1px solid var(--stone);background:var(--ivory);
      font-family:'Lato',sans-serif;font-size:13px;border-radius:2px;outline:none;
    }
    .filter-group input:focus,.filter-group select:focus{border-color:var(--gold);}
    .filter-actions{display:flex;gap:8px;align-items:flex-end;}
    .btn-clear{
      padding:9px 16px;background:transparent;border:1px solid var(--stone);
      color:var(--taupe);font-size:11px;letter-spacing:1px;cursor:pointer;
      border-radius:2px;font-family:'Lato',sans-serif;transition:all .2s;
    }
    .btn-clear:hover{border-color:var(--gold);color:var(--gold);}
    .btn-export{
      padding:9px 20px;background:var(--black);color:var(--gold);
      border:none;font-size:11px;letter-spacing:2px;text-transform:uppercase;
      cursor:pointer;border-radius:2px;font-family:'Lato',sans-serif;transition:background .2s;
    }
    .btn-export:hover{background:#333;}

    /* ── Bookings Table ── */
    .table-wrapper{background:white;border-radius:4px;overflow:hidden;}
    .table-header{
      padding:20px 24px;display:flex;justify-content:space-between;
      align-items:center;border-bottom:1px solid var(--stone);
    }
    .table-title{font-family:'Cormorant Garamond',serif;font-size:20px;}
    #booking-count{font-size:12px;color:var(--taupe);letter-spacing:1px;}
    .admin-table{width:100%;border-collapse:collapse;}
    .admin-table thead{background:var(--black);}
    .admin-table thead th{
      padding:14px 16px;text-align:left;font-size:10px;
      letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:400;
    }
    .admin-table tbody tr{border-bottom:1px solid #f5f0e8;transition:background .15s;}
    .admin-table tbody tr:hover{background:#faf7f2;}
    .admin-table td{padding:14px 16px;font-size:13px;vertical-align:middle;}
    .admin-table td.center{text-align:center;}
    .admin-table td.price{font-weight:700;color:var(--black);}
    .booking-ref{font-family:'Lato',sans-serif;font-weight:700;font-size:12px;
      letter-spacing:1px;color:var(--gold);}
    .guest-name{font-weight:600;font-size:13px;margin-bottom:3px;}
    .guest-email{font-size:11px;color:var(--taupe);}
    .guest-phone{font-size:11px;color:var(--taupe);}

    /* ── Status Selects ── */
    .status-select{
      padding:6px 10px;border-radius:20px;font-size:11px;letter-spacing:1px;
      font-family:'Lato',sans-serif;border:none;cursor:pointer;font-weight:600;
      -webkit-appearance:none;text-align:center;
    }
    .status-pending{background:#fff8e6;color:#b7860b;}
    .status-confirmed{background:#e6f7ee;color:#2d7a4f;}
    .status-cancelled{background:#fdecea;color:#c0392b;}

    .btn-view{
      padding:6px 14px;background:transparent;border:1px solid var(--stone);
      color:var(--taupe);font-size:11px;cursor:pointer;border-radius:2px;
      font-family:'Lato',sans-serif;transition:all .2s;
    }
    .btn-view:hover{border-color:var(--gold);color:var(--gold);}
    .empty-state{padding:60px;text-align:center;color:var(--taupe);font-size:14px;letter-spacing:1px;}

    /* ── Messages ── */
    .messages-grid{display:grid;gap:16px;}
    .message-card{background:white;border-radius:4px;padding:24px;border-left:3px solid var(--stone);transition:border-color .2s;}
    .message-card:hover{border-left-color:var(--gold);}
    .message-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
    .message-name{font-weight:700;font-size:15px;margin-right:10px;}
    .message-subject{font-size:12px;color:var(--taupe);letter-spacing:1px;}
    .message-date{font-size:11px;color:var(--taupe);white-space:nowrap;}
    .message-meta{display:flex;gap:20px;font-size:12px;color:var(--taupe);margin-bottom:12px;}
    .message-body{font-size:14px;line-height:1.7;color:#444;margin-bottom:16px;}
    .message-actions{display:flex;gap:10px;}
    .btn-reply{
      padding:7px 16px;background:var(--black);color:var(--gold);
      text-decoration:none;font-size:11px;letter-spacing:1px;border-radius:2px;
    }
    .btn-whatsapp{
      padding:7px 16px;background:#25D366;color:white;
      text-decoration:none;font-size:11px;letter-spacing:1px;border-radius:2px;
    }

    /* ── Modal ── */
    #booking-modal{
      display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
      z-index:200;align-items:center;justify-content:center;padding:20px;
    }
    .modal-box{
      background:white;border-radius:4px;width:100%;max-width:680px;
      max-height:90vh;overflow-y:auto;
    }
    .modal-top{
      background:var(--black);padding:24px 28px;
      display:flex;justify-content:space-between;align-items:center;
    }
    .modal-top h2{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:22px;}
    #modal-close{
      background:transparent;border:1px solid #444;color:#aaa;
      width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;
    }
    #modal-content{padding:28px;}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
    .modal-header h2{font-family:'Cormorant Garamond',serif;font-size:26px;}
    .modal-status{padding:6px 16px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;}
    .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
    .modal-section{background:var(--ivory);padding:20px;border-radius:4px;}
    .modal-section.full{grid-column:1/-1;}
    .modal-section h3{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--taupe);margin-bottom:14px;}
    .modal-section p{font-size:13px;margin-bottom:8px;line-height:1.6;}
    .price-summary{display:flex;justify-content:space-between;align-items:center;background:var(--black);color:white;}
    .price-summary div:first-child{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#888;}
    .big-price{font-family:'Cormorant Garamond',serif;font-size:32px;color:var(--gold);}

    /* ── Toast ── */
    .toast{
      position:fixed;bottom:24px;right:24px;padding:14px 20px;
      border-radius:4px;font-size:13px;font-weight:600;z-index:9999;
      transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none;
    }
    .toast.show{transform:translateY(0);opacity:1;}
    .toast-success{background:#1A1A1A;color:#C8A96E;}
    .toast-error{background:#c0392b;color:white;}

    @media(max-width:900px){
      .stats-grid{grid-template-columns:repeat(2,1fr);}
      .modal-grid{grid-template-columns:1fr;}
      .modal-section.full{grid-column:1;}
    }
    @media(max-width:600px){
      .stats-grid{grid-template-columns:1fr 1fr;}
      .admin-table thead th:nth-child(n+4){display:none;}
      .admin-table td:nth-child(n+4){display:none;}
      .admin-table thead th:last-child,.admin-table td:last-child{display:table-cell;}
      .admin-table thead th:nth-child(7),.admin-table td:nth-child(7){display:table-cell;}
    }
  </style>
</head>
<body>

<!-- ── Auth Overlay ────────────────────────────── -->
<div id="auth-overlay">
  <div class="auth-box">
    <div class="auth-logo">NITARA <span>STAYS</span></div>
    <div class="auth-sub">Admin Access</div>
    <label class="auth-label" for="admin-password">Password</label>
    <input type="password" id="admin-password" class="auth-input" placeholder="Enter admin password" />
    <button id="login-btn" class="auth-btn">Enter Dashboard</button>
    <div id="auth-error"></div>
  </div>
</div>

<!-- ── Dashboard ───────────────────────────────── -->
<div id="dashboard">

  <nav class="admin-nav">
    <div class="admin-nav-logo">NITARA <span>STAYS</span> &nbsp;·&nbsp; <span style="font-size:12px;color:#888;letter-spacing:1px;font-family:Lato,sans-serif;">Admin</span></div>
    <div class="admin-nav-right">
      <span id="current-date"></span>
      <button id="logout-btn" class="logout-btn">Logout</button>
    </div>
  </nav>

  <div class="admin-body">

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">🏔</div>
        <div class="stat-label">Total Bookings</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">₹</div>
        <div class="stat-label">Revenue This Month</div>
        <div class="stat-value" id="stat-revenue">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⏳</div>
        <div class="stat-label">Pending Bookings</div>
        <div class="stat-value" id="stat-pending">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">✉</div>
        <div class="stat-label">Messages</div>
        <div class="stat-value" id="stat-messages">—</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="bookings">Bookings</button>
      <button class="tab-btn" data-tab="messages">Messages</button>
    </div>

    <!-- Bookings Tab -->
    <div id="tab-bookings" class="tab-panel active">
      <div class="filters-bar">
        <div class="filter-group" style="flex:2;min-width:200px;">
          <label>Search</label>
          <input type="text" id="filter-search" placeholder="Name, email, ref..." />
        </div>
        <div class="filter-group">
          <label>Status</label>
          <select id="filter-status">
            <option value="">All</option>
            <option>Pending</option>
            <option>Confirmed</option>
            <option>Cancelled</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Destination</label>
          <select id="filter-destination"><option value="">All</option></select>
        </div>
        <div class="filter-group">
          <label>Check-in From</label>
          <input type="date" id="filter-date-from" />
        </div>
        <div class="filter-group">
          <label>Check-in To</label>
          <input type="date" id="filter-date-to" />
        </div>
        <div class="filter-actions">
          <button class="btn-clear" onclick="clearFilters()">Clear</button>
          <button class="btn-export" id="export-csv">Export CSV</button>
        </div>
      </div>

      <div class="table-wrapper">
        <div class="table-header">
          <div class="table-title">All Bookings</div>
          <div id="booking-count"></div>
        </div>
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Ref</th>
                <th>Guest</th>
                <th>Destination</th>
                <th>Check-In</th>
                <th>Check-Out</th>
                <th>Guests</th>
                <th>Total</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="bookings-tbody"></tbody>
          </table>
        </div>
        <div id="bookings-empty" class="empty-state" style="display:none;">
          No bookings yet. They will appear here as guests book.
        </div>
      </div>
    </div>

    <!-- Messages Tab -->
    <div id="tab-messages" class="tab-panel">
      <div id="messages-list" class="messages-grid"></div>
    </div>

  </div>
</div>

<!-- Booking Detail Modal -->
<div id="booking-modal">
  <div class="modal-box">
    <div class="modal-top">
      <h2>Booking Detail</h2>
      <button id="modal-close">✕</button>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="js/admin.js"></script>
</body>
</html>
